[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leak-detector-starter"
version = "0.1.0"
description = "A teaching scaffold for detecting look-ahead bias in factor code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0.0", "numpy>=1.24", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
